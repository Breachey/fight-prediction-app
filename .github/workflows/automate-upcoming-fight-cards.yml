name: Automate upcoming fight cards

on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:
    inputs:
      event_id:
        description: Optional event table ID to process immediately
        required: false
        type: string
      dry_run:
        description: Select and inspect events without scraping or writing
        required: false
        default: false
        type: boolean

concurrency:
  group: automate-upcoming-fight-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTOMATION_EVENT_ID: ${{ inputs.event_id }}
      AUTOMATION_DRY_RUN: ${{ inputs.dry_run }}
      AUTOMATION_TIME_ZONE: America/Denver
      AUTOMATION_MAX_EVENTS: '2'
      AUTOMATION_NEW_CARD_PROFILE_LIMIT: '4'
      AUTOMATION_REFRESH_PROFILE_LIMIT: '2'
      AUTOMATION_REPORT_PATH: automation-report.json
      TAPOLOGY_DELAY_SECONDS: '2.5'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Server/scraper/requirements.txt

      - name: Install server dependencies
        run: npm ci --prefix Server --ignore-scripts

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check -r Server/scraper/requirements.txt

      - name: Scrape and incrementally fill due fight cards
        id: automation
        run: npm run automate:fight-cards

      - name: Email automation report
        if: ${{ always() }}
        env:
          AUTOMATION_EMAIL_FROM: breachey@gmail.com
          AUTOMATION_EMAIL_TO: breachey@gmail.com
          AUTOMATION_GMAIL_APP_PASSWORD: ${{ secrets.AUTOMATION_GMAIL_APP_PASSWORD }}
          AUTOMATION_WORKFLOW_OUTCOME: ${{ steps.automation.outcome }}
          AUTOMATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python Server/scripts/email_automation_report.py automation-report.json
